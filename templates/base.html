<!DOCTYPE html>
<html lang="es" class="">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MediPortal{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-200 min-h-screen antialiased">

    <!-- Background decorativo -->
    <div aria-hidden="true" class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden">
        <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-accent-400/10 dark:bg-accent-600/10 blur-3xl"></div>
        <div class="absolute top-1/3 -right-40 w-[28rem] h-[28rem] rounded-full bg-accent-300/10 dark:bg-accent-700/10 blur-3xl"></div>
        <div class="absolute -bottom-20 left-1/3 w-80 h-80 rounded-full bg-accent-500/10 dark:bg-accent-500/10 blur-3xl"></div>
        <div class="absolute inset-0 opacity-[0.35] dark:opacity-[0.15]"
            style="background-image:radial-gradient(circle, #94a3b8 1px, transparent 1px);background-size:32px 32px;"></div>
    </div>

    <!-- Aplicar tema ANTES de pintar para evitar flash -->
    <script>
        (function() {
            const saved = localStorage.getItem('mp_theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    {% block body %}{% endblock %}

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('mp_theme', isDark ? 'dark' : 'light');
            const btn = document.getElementById('theme-toggle');
            if (btn) {
                btn.querySelector('.icon-sun').style.display  = isDark ? 'block' : 'none';
                btn.querySelector('.icon-moon').style.display = isDark ? 'none'  : 'block';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.getElementById('theme-toggle');
            if (!btn) return;
            const isDark = document.documentElement.classList.contains('dark');
            btn.querySelector('.icon-sun').style.display  = isDark ? 'block' : 'none';
            btn.querySelector('.icon-moon').style.display = isDark ? 'none'  : 'block';
        });

        // Auto-ocultar alertas después de 5s
        document.addEventListener('DOMContentLoaded', function() {
            const alerts = document.querySelectorAll('.auto-dismiss');
            alerts.forEach(function(el) {
                setTimeout(function() {
                    el.style.transition = 'opacity 0.5s ease';
                    el.style.opacity = '0';
                    setTimeout(function() { el.remove(); }, 500);
                }, 5000);
            });
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
